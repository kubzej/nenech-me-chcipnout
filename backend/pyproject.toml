[project]
name = "nenech-me-chcipnout-backend"
version = "0.1.0"
description = "FastAPI backend for Nenech me chcipnout"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pillow>=10.4.0",
  "pydantic-settings>=2.6.0",
  "PyJWT[crypto]>=2.9.0",
  "pywebpush>=2.0.0",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0"
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
